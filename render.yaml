services:
  - type: web
    name: gluco-api-mtz-lab
    runtime: docker
    plan: free
    region: virginia
    healthCheckPath: /api/glucosa/saludar
    envVars:
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
      - key: DB_NAME
        value: gluco_API
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_SSL
        value: "true"
